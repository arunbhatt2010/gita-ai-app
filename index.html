<!DOCTYPE html>
<html>
<head>
  <title>Gita AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: gold;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
    }

    button {
      background: gold;
      padding: 12px;
      width: 100%;
      border: none;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    #chat {
      min-height: 200px;
      margin-bottom: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

  <h1>🕉️ Gita AI</h1>
  <p>Get clarity in 30 seconds from Gita wisdom</p>

  <div id="chat"></div>

  <textarea id="input" placeholder="Ask your problem..."></textarea>
  <button onclick="sendMessage()">Get Clarity →</button>

  <script>
    async function sendMessage() {
      const inputBox = document.getElementById("input");
      const chat = document.getElementById("chat");

      const text = inputBox.value.trim();
      if (!text) return;

      // User message
      chat.innerHTML += `<div><b>You:</b> ${text}</div>`;
      inputBox.value = "";

      // Thinking...
      const botDiv = document.createElement("div");
      botDiv.innerText = "Thinking...";
      chat.appendChild(botDiv);

      try {
        const res = await fetch("https://gita-ai-backend-dzeqpc5fs-arun-prakash-bhatt-s-projects.vercel.app/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await res.json();

        botDiv.innerHTML = `<b>Krishna:</b><br><br>${data.reply || "No response"}`;
